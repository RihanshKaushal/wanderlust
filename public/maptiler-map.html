<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapTiler Lucknow Map</title>

  <!-- MapTiler SDK JS and CSS from the official CDN -->
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.umd.min.js"></script>
  <link href="https://cdn.maptiler.com/maptiler-sdk-js/v4.0.2/maptiler-sdk.css" rel="stylesheet">

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    /* The map needs a real height, so this fills the entire browser window. */
    #map {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>
  <!-- MapTiler will render the interactive map inside this div. -->
  <div id="map"></div>

  <script src="./js/maptiler-map.js"></script>
</body>
</html>
